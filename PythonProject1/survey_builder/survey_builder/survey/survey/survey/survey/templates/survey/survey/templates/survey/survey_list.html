{% extends 'survey/base.html' %}
{% block content %}
<h2 class="mb-3">Available Surveys</h2>
<div class="list-group">
    {% for survey in surveys %}
    <a href="{% url 'builder' survey.id %}" class="list-group-item list-group-item-action">
        <strong>{{ survey.title }}</strong><br>
        <small>{{ survey.description }}</small>
    </a>
    {% empty %}
    <p>No surveys available.</p>
    {% endfor %}
</div>
{% endblock %}
