<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Template - EduQuery Style</title>
    <style>
        :root {
            /* EduQuery Color Palette */
            --black: #000000;
            --green-700: #007B3B;
            --deep-forest: #1F3C35;
            --sage: #597868;
            --sage-500: #7D998A;
            --zinc-300: #D9D9D9;
            --stone-200: #EAE9E4;
            --white: #FFFFFF;
            --brand: #2F5E53;

            /* Layout tokens */
            --aside-w: clamp(420px, 26vw, 640px);
            --radius: clamp(12px, 1vw, 16px);
            --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: "Poppins", Inter, sans-serif;
        }

        /* Main Background Gradient */
        body {
            min-height: 100vh;
            margin: 0;
            color: #1f2937;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(135deg, var(--zinc-300) 0%, var(--sage) 100%);
        }

        /* Page wrapper */
        .page {
            position: relative;
            min-height: 100vh;
        }

        .main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 640px) {
            .main {
                padding: 20px 24px;
            }
        }

        @media (min-width: 1024px) {
            .main {
                padding: 24px 32px;
                padding-right: var(--aside-w);
            }
        }

        /* Content container */
        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow-md);
        }

        /* Right-side illustration panel (for sign-up style) */
        .illustration {
            display: none;
        }

        @media (min-width: 1024px) {
            .illustration {
                height: 100vh;
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: clamp(500px, 35vw, 720px);
                background: var(--sage);
                border-top-left-radius: 80px;
                border-bottom-left-radius: 80px;
                overflow: hidden;
                box-shadow: var(--shadow-md);
                display: flex;
                align-items: flex-end;
                justify-content: flex-end;
                z-index: 0;
            }

            .illustration img {
                height: 105%;
                width: 150%;
                object-fit: contain;
                margin-right: -40px;
                margin-bottom: -20px;
                filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.4));
            }
        }

        /* Left-side illustration panel (for sign-in style) */
        .illustration2 {
            display: none;
        }

        @media (min-width: 1024px) {
            .illustration2 {
                height: 100vh;
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: clamp(500px, 35vw, 720px);
                background: var(--sage);
                border-top-right-radius: 80px;
                border-bottom-right-radius: 80px;
                overflow: hidden;
                box-shadow: var(--shadow-md);
                display: flex;
                align-items: flex-end;
                justify-content: flex-end;
                z-index: 0;
            }

            .illustration2 img {
                height: 100%;
                width: 150%;
                object-fit: contain;
                margin-right: -20px;
                margin-bottom: -20px;
                filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.4));
            }
        }

        /* Sign-in specific layout adjustments */
        body.signin .main {
            padding: 24px 32px;
            padding-left: var(--aside-w);
            padding-right: 32px;
        }

        .containerSignIn {
            margin-left: 150px;
        }

        @media (min-width: 1024px) {
            .containerSignIn {
                margin-left: 100px;
            }
        }

        /* Demo content styling */
        .demo-content {
            text-align: center;
            color: var(--deep-forest);
        }

        .demo-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--black);
        }

        .demo-subtitle {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: var(--deep-forest);
        }

        .demo-button {
            background: var(--green-700);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .demo-button:hover {
            background: var(--brand);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="page">
        <main class="main">
            <div class="container">
                <div class="demo-content">
                    <h1 class="demo-title">EduQuery Background</h1>
                    <p class="demo-subtitle">This is the complete background template with gradient and styling from the sign-in and sign-up pages.</p>
                    <button class="demo-button">Sample Button</button>
                </div>
            </div>
        </main>

        <!-- Right-side illustration panel (uncomment for sign-up style) -->
        <!--
        <aside class="illustration" aria-hidden="true">
            <img src="your-image.png" alt="" />
        </aside>
        -->

        <!-- Left-side illustration panel (uncomment for sign-in style) -->
        <!--
        <aside class="illustration2" aria-hidden="true">
            <img src="your-image.png" alt="" />
        </aside>
        -->
    </div>
</body>
</html>
