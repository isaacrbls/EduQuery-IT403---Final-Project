{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUQUERY - Response Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/ui-lightness/jquery-ui.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/responses/ResponseViewer.css' %}">
</head>
<body>
    <div class="response-viewer-container">
        <!-- Header -->
        <div class="viewer-header">
            <div class="header-content">
                <div class="header-title">
                    <span class="material-icons">assignment</span>
                    <h1>Response Viewer</h1>
                </div>
                <div class="header-actions">
                    <a href="{% url 'accounts:teacher_dashboard' %}" class="btn btn-outline-secondary">
                        <span class="material-icons">arrow_back</span>
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="filters-section">
            <div class="container-fluid">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="student-search" class="form-label">
                            <span class="material-icons">person_search</span>
                            Student Name
                        </label>
                        <input type="text" id="student-search" class="form-control" placeholder="Search by student name...">
                    </div>
                    <div class="col-md-2">
                        <label for="date-from" class="form-label">
                            <span class="material-icons">event</span>
                            Date From
                        </label>
                        <input type="text" id="date-from" class="form-control datepicker" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="col-md-2">
                        <label for="date-to" class="form-label">
                            <span class="material-icons">event</span>
                            Date To
                        </label>
                        <input type="text" id="date-to" class="form-control datepicker" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="col-md-2">
                        <label for="survey-filter" class="form-label">
                            <span class="material-icons">assignment</span>
                            Survey
                        </label>
                        <select id="survey-filter" class="form-select">
                            <option value="">All Surveys</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="sort-by" class="form-label">
                            <span class="material-icons">sort</span>
                            Sort By
                        </label>
                        <select id="sort-by" class="form-select">
                            <option value="-submitted_at">Newest First</option>
                            <option value="submitted_at">Oldest First</option>
                            <option value="survey__title">Survey Title (A-Z)</option>
                            <option value="-survey__title">Survey Title (Z-A)</option>
                            <option value="respondent__username">Student Name (A-Z)</option>
                            <option value="-respondent__username">Student Name (Z-A)</option>
                        </select>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" id="clear-filters" class="btn btn-outline-danger w-100">
                            <span class="material-icons">clear</span>
                            Clear
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="table-section">
            <div class="container-fluid">
                <div class="table-responsive">
                    <table class="table table-hover table-striped" id="responses-table">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" data-sort="id">ID</th>
                                <th scope="col" data-sort="survey__title">Survey</th>
                                <th scope="col" data-sort="respondent__username">Student</th>
                                <th scope="col" data-sort="submitted_at">Submitted At</th>
                                <th scope="col">Answers</th>
                                <th scope="col">Status</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="responses-tbody">
                            <tr>
                                <td colspan="7" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2">Loading responses...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav aria-label="Response pagination" class="mt-4">
                    <ul class="pagination justify-content-center" id="pagination">
                        <!-- Pagination will be inserted here by JavaScript -->
                    </ul>
                </nav>

                <!-- Results Info -->
                <div class="results-info mt-3 text-center">
                    <p class="text-muted" id="results-info">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Response Detail Modal -->
    <div class="modal fade" id="responseDetailModal" tabindex="-1" aria-labelledby="responseDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="responseDetailModalLabel">
                        <span class="material-icons">assignment</span>
                        Response Details
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="response-detail-content">
                    <!-- Response details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- CSRF Token -->
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');
    </script>
    
    <!-- Custom JavaScript -->
    <script src="{% static 'js/responses/ResponseViewer.js' %}"></script>
</body>
</html>
