<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - EduQuery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="terms-modal.css" />
</head>

<body class="signin">
  <div class="page">
    <main class="main">
      <div class="containerSignIn">
        <div class="logo">
          <img class="logo-img" src="images/logo2.png" alt="EduQuery logo" />
        </div>
        <h1 class="title signin-title">Welcome back!</h1>
        <p class="subtitle signin-subtitle fw-light">Please enter your credentials</p>

        <form class="SignInForm" autocomplete="on">
          <div class="row">
            <div class="field">
              <label class="sr-only" for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label class="sr-only" for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" />
            </div>
          </div>

          <!-- Actions under password: Remember me (left) and Forgot Password (right) -->
          <div class="terms signin-actions">
            <label for="remember" class="remember-me">
              <input type="checkbox" id="remember" />
              <span>Remember me</span>
            </label>
            <a href="{% url 'accounts:forgot_password' %}" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btnSignIn primary full">LOGIN</button>

          <p class="btnSignIn-helper">Don't have an account? <a href="#">SIGN UP</a></p>
        </form>
      </div>
    </main>

    <!-- Illustration on the left for Sign In only (overridden via inline CSS above) -->
    <aside class="illustration2" aria-hidden="true">
      <img src="images/signinImages - file.png" alt="" />
    </aside>
  </div>

  <script src="accounts.js"></script>
</body>
</html>
