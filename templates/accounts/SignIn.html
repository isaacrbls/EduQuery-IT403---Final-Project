{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - EduQuery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/accounts/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/accounts/terms-modal.css' %}" />
</head>

<body class="signin">
  <div class="page">
    <main class="main">
      <div class="containerSignIn">
        <div class="logo">
          <img class="logo-img" src="{% static 'images/accounts/logo2.png' %}" alt="EduQuery logo" />
        </div>
        <h1 class="title signin-title">Welcome back!</h1>
        <p class="subtitle signin-subtitle fw-light">Please enter your credentials</p>

        {% if messages %}
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          {% endfor %}
        {% endif %}

        <form class="SignInForm" method="POST" action="{% url 'accounts:login' %}" autocomplete="on">
          {% csrf_token %}
          <div class="row">
            <div class="field">
              <label class="sr-only" for="username">Username</label>
              <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required />
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label class="sr-only" for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
            </div>
          </div>

          <!-- Actions under password: Remember me -->
          <div class="terms signin-actions">
            <label for="remember_me" class="remember-me">
              <input type="checkbox" id="remember_me" name="remember_me" />
              <span>Remember me</span>
            </label>
          </div>

          <button type="submit" class="btnSignIn primary full">LOGIN</button>

          <p class="btnSignIn-helper">Don't have an account? <a href="{% url 'accounts:signup' %}">SIGN UP</a></p>
        </form>
      </div>
    </main>

    <!-- Illustration on the left for Sign In only (overridden via inline CSS above) -->
    <aside class="illustration2" aria-hidden="true">
      <img src="{% static 'images/accounts/signinImages - file.png' %}" alt="" />
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="{% static 'js/accounts/accounts.js' %}"></script>
</body>
</html>
