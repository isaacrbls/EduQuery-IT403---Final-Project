{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - EduQuery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/accounts/style.css' %}">

</head>

<body class="forgot-page">
  <div class="page">
    <main class="main">
      <div class="fp-container w-100">
        <div class="logo mb-2">
          <img class="logo-img" src="{% static 'images/accounts/logo2.png' %}" alt="EduQuery logo" />
        </div>
        <h1 class="title signin-title">Forgot Password</h1>
        <p class="fp-sub">we’ll send you the updated instructions shortly.</p>

        <form class="fp-form" method="post" action="">
          <div class="row">
            <div class="field">
              <label class="sr-only" for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required />
            </div>
          </div>

          <div class="fp-actions">
            <button type="submit" class="fp-btn">Reset password</button>
          </div>
        </form>
      </div>
    </main>

    <!-- Illustration on the left to match the mockup -->
    <aside class="illustration2" aria-hidden="true">
      <img src="{% static 'images/accounts/signinImages - file.png' %}" alt="" />
    </aside>
  </div>

  <script src="{% static 'js/accounts/accounts.js' %}"></script>
</body>
</html>
