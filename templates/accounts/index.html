{% extends 'base.html' %}

{% block title %}Welcome to EduQuery{% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-100 align-items-center">
        <div class="col-lg-6 mx-auto text-center">
            <i class="fas fa-graduation-cap text-primary" style="font-size: 5rem;"></i>
            <h1 class="display-4 fw-bold mt-4">Welcome to EduQuery</h1>
            <p class="lead text-muted mb-4">
                A modern survey platform for educational institutions
            </p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                {% if user.is_authenticated %}
                    <a href="{% url 'surveys:dashboard' %}" class="btn btn-primary btn-lg px-4 gap-3">
                        Go to Dashboard
                    </a>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg px-4 gap-3">
                        Login
                    </a>
                    <a href="{% url 'accounts:signup' %}" class="btn btn-outline-secondary btn-lg px-4">
                        Sign Up
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
